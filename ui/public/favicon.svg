<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="maap-logo-title">
  <title id="maap-logo-title">MAAP</title>
  <defs>
    <linearGradient id="maap-surface" x1="18" y1="12" x2="103" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="maap-network" x1="25" y1="22" x2="97" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7079" />
      <stop offset="0.5" stop-color="#F35B68" />
      <stop offset="1" stop-color="#00D5C0" />
    </linearGradient>
    <filter id="maap-glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#maap-surface)" />
