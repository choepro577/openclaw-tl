  />

  <g filter="url(#maap-glow)">
    <circle cx="60" cy="60" r="10" fill="#0F172A" stroke="#00D5C0" stroke-width="3" />
    <circle cx="60" cy="60" r="4" fill="#F8FAFC" />
    <circle cx="60" cy="22" r="5.5" fill="#FF7079" />
